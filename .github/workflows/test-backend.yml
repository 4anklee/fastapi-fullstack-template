name: Test Backend

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize

permissions:
    contents: read

jobs:
    test-backend:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: test-db-password
                    POSTGRES_DB: app_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d app_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            mailcatcher:
                image: schickling/mailcatcher@sha256:55ed289525a565f7587b138a423705267eb34eda1ec8d35acd6dc7966a933e84
                ports:
                    - 1025:1025
        env:
            PROJECT_NAME: Test App
            ENVIRONMENT: local
            SECRET_KEY: ci-only-secret-for-tests-at-least-32-characters
            FIRST_SUPERUSER: admin@example.com
            FIRST_SUPERUSER_PASSWORD: test-admin-password
            POSTGRES_SERVER: 127.0.0.1
            POSTGRES_PORT: "5432"
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: test-db-password
            POSTGRES_DB: app_test
            SMTP_HOST: 127.0.0.1
            SMTP_PORT: "1025"
            SMTP_TLS: "false"
            EMAILS_FROM_EMAIL: noreply@example.com
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.14"
            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
              with:
                  # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
                  # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
                  version: "0.11.4"
            - name: Migrate DB
              run: uv run bash scripts/prestart.sh
              working-directory: backend
            - name: Run tests
              run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
              working-directory: backend
            - name: Store coverage files
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-html
                  path: backend/htmlcov
                  include-hidden-files: true
            - name: Coverage report
              run: uv run coverage report --fail-under=90
              working-directory: backend
