[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.162.0",
    "python-multipart<1.0.0,>=0.0.32",
    "email-validator<3.0.0.0,>=2.3.0",
    # Pydantic AI's google-genai dependency currently requires tenacity<9.2.0.
    "tenacity<10.0.0,>=9.1.4",
    "pydantic<3.0.0,>=2.14.1",
    "emails<2.0,>=1.1.3",
    "jinja2<4.0.0,>=3.1.6",
    "alembic<2.0.0,>=1.20.1",
    "httpx<1.0.0,>=0.28.1",
    "psycopg[binary]<4.0.0,>=3.3.6",
    "sqlmodel<1.0.0,>=0.0.48",
    "pydantic-settings<3.0.0,>=2.16.1",
    "sentry-sdk[fastapi]>=2.73.0,<3.0.0",
    "pyjwt<3.0.0,>=2.15.1",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "greenlet>=3.5.6",
    "pydantic-ai>=2.60.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=9.1.1",
    "ty>=0.0.91",
    "ruff<1.0.0,>=0.17.2",
    "prek>=0.5.7,<1.0.0",
    "coverage<8.0.0,>=7.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true
